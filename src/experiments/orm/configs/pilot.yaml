# Pilot campaign (PREREGISTRATION.md: Pilot gate, cap $110). Never used in the experiment.
# Run: doppler run -- uv run tau2 lifecycle run --config src/experiments/orm/configs/pilot.yaml --out runs/pilot
# Gate: uv run python -m experiments.orm.pilot_gate --run runs/pilot --cutoff 59
name: pilot-1
seed: 7
customers: 30
days: 60
variants:
  - {name: g41-f0, agent_llm: gpt-4.1-2025-04-14, failure_rate: 0.0}
  - {name: g41-f10, agent_llm: gpt-4.1-2025-04-14, failure_rate: 0.1}
  - {name: g41-f30, agent_llm: gpt-4.1-2025-04-14, failure_rate: 0.3}
  - {name: g41mini-f0, agent_llm: gpt-4.1-mini-2025-04-14, failure_rate: 0.0}
  - {name: g41mini-f10, agent_llm: gpt-4.1-mini-2025-04-14, failure_rate: 0.1}
  - {name: g41mini-f30, agent_llm: gpt-4.1-mini-2025-04-14, failure_rate: 0.3}
  - {name: g5-f0, agent_llm: gpt-5-2025-08-07, failure_rate: 0.0}
  - {name: g5-f10, agent_llm: gpt-5-2025-08-07, failure_rate: 0.1}
  - {name: g5-f30, agent_llm: gpt-5-2025-08-07, failure_rate: 0.3}
user_llm: gpt-4.1-2025-04-14       # simulated customer, same for all variants
csat_llm: gpt-4.1-mini-2025-04-14  # CSAT rater
budget_usd: 110.0                  # hard cap; raised from D15's $75 (PREREGISTRATION deviation 2)
cost_bound_usd: 0.40               # reserved per conversation before each day (OV10); one gpt-5 call cost $0.255
max_concurrency: 8
max_steps: 100
task_split: base
max_infra_error_share: 0.5
hazard: {}                         # HazardConfig defaults (~7% leave intent / 30 days)
